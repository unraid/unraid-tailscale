on:
  release:
    types:
      - prereleased
      - released

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: dkaser/unraid-plugin-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plg_branch: trunk
          build_prereleases: true
          ssh_key: ${{ secrets.DEPLOY_KEY }}
          composer_dir: src/usr/local/php/unraid-tailscale-utils/
